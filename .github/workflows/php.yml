name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'version.txt'
      - 'LICENSE'
      - '.gitignore'
    branches-ignore:
      - 'dev'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'version.txt'
      - 'LICENSE'
      - '.gitignore'
    branches-ignore:
      - 'dev'

permissions:
  contents: read


jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        operating-system: [ ubuntu-latest ]
        php-versions:
          - '8.2'
          - '8.3'
          - '8.4'
        laravel:
          - '9.*'
          - '10.*'
          - '11.*'
          - '12.*'
          - '13.*'
        dependencies:
          - 'prefer-lowest'
          - 'prefer-stable'
        exclude:
          - php-versions: '8.2'
            laravel: '13.*'
    name: PHP ${{ matrix.php-versions }} - Laravel ${{ matrix.laravel }} (${{ matrix.dependencies }}) Test on ${{ matrix.operating-system }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-versions }}-laravel-${{ matrix.laravel }}-${{ matrix.dependencies }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-versions }}-laravel-${{ matrix.laravel }}-${{ matrix.dependencies }}-

      - name: Install dependencies
        run: |
          composer require "illuminate/http:${{ matrix.laravel }}" "illuminate/mail:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.dependencies }} --prefer-dist --no-progress --no-audit

      # Add a test script to composer.json, for instance: "test": "vendor/bin/phpunit"
      # Docs: https://getcomposer.org/doc/articles/scripts.md

      - name: Run test suite
        run: composer run-script test

  #-----------------------------------------------------------------------------------------
  coverage:
    if: ${{ always() }}
    needs: [ build ]

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: xdebug

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # Add a test script to composer.json, for instance: "test": "vendor/bin/phpunit"
      # Docs: https://getcomposer.org/doc/articles/scripts.md

      - name: Run test suite
        run: composer run-script coverage



      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/coverage.xml
          format: clover