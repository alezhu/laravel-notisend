name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        operating-system: [ ubuntu-latest ]
        php-versions:
          - '8.2'
          - '8.3'
          - '8.4'
        laravel:
          - '9.*'
          - '10.*'
          - '11.*'
          - '12.*'
          - '13.*'
        dependencies:
          - 'prefer-lowest'
          - 'prefer-stable'
        exclude:
          - php-versions: '8.2'
            laravel: '13.*'
    name: PHP ${{ matrix.php-versions }} - Laravel ${{ matrix.laravel }} (${{ matrix.dependencies }}) Test on ${{ matrix.operating-system }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-versions }}-laravel-${{ matrix.laravel }}-${{ matrix.dependencies }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-versions }}-laravel-${{ matrix.laravel }}-${{ matrix.dependencies }}-

      - name: Install dependencies
        env:
          COMPOSER_NO_AUDIT: 1
        run: |
          composer config platform.php --unset || true
          composer config audit.ignore PKSA-zwc5-qtrz-zm1n --no-interaction
          composer require "illuminate/http:${{ matrix.laravel }}" "illuminate/mail:${{ matrix.laravel }}" --no-interaction --no-update --no-audit
          composer update --${{ matrix.dependencies }} --prefer-dist --no-progress --no-audit

      - name: Run test suite
        run: composer run-script test
