name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        operating-system: [ ubuntu-latest ]
        php-versions:
          - '8.2'
          - '8.3'
          - '8.4'
        dependencies:
          - 'prefer-lowest'
          - 'prefer-stable'
    name: PHP ${{ matrix.php-versions }} (${{ matrix.dependencies }}) Test on ${{ matrix.operating-system }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-versions }}-${{ matrix.dependencies }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-versions }}-${{ matrix.dependencies }}-

      - name: Install dependencies
        run: composer update --${{ matrix.dependencies }} --prefer-dist --no-progress

      - name: Run test suite
        run: composer run-script test

  release:
    needs: [ build ]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[?/ {
              if (found) exit;
              if ($0 ~ "^## \\[" ver "\\]" || $0 ~ "^## " ver) {
                found = 1;
                next;
              }
            }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          token: ${{ secrets.GITHUB_TOKEN }}
